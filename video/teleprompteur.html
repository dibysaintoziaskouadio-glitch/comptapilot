<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Comptapilot — enregistrement de la voix</title>
<link rel="stylesheet" href="polices.css" />
<style>
/*
 * Téléprompteur : l'animation défile en temps réel pendant que votre voix est enregistrée au micro.
 * Le texte à dire s'affiche au bon moment, avec un compte à rebours. À la fin, le fichier voix.webm est téléchargé.
 */
* { box-sizing: border-box; margin: 0; }
body { background: #0d0818; color: #fff; font-family: 'Figtree Variable', system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px; gap: 18px; }
h1 { font-family: 'Sora Variable', sans-serif; font-size: 24px; }
.cadre { width: min(96vw, 1100px); aspect-ratio: 16 / 9; position: relative; border-radius: 18px; overflow: hidden; box-shadow: 0 30px 80px -30px #000; background: #140d24; }
.cadre iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; }
.texte { width: min(96vw, 1100px); min-height: 150px; border-radius: 18px; padding: 22px 28px; background: #1d1430; border: 1px solid #ffffff22; font-size: 34px; line-height: 1.35; font-weight: 600; transition: background .3s; }
.texte.actif { background: linear-gradient(120deg, #4c1d95, #831843); }
.texte small { display: block; font-size: 15px; font-weight: 500; opacity: .7; margin-bottom: 8px; letter-spacing: .04em; text-transform: uppercase; }
.suivant { width: min(96vw, 1100px); font-size: 18px; opacity: .55; }
.barre { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
button { font: 700 16px 'Figtree Variable', sans-serif; border: 0; border-radius: 999px; padding: 14px 26px; cursor: pointer; color: #fff; background: linear-gradient(100deg, #9333ea, #db2777); }
button.second { background: #ffffff1a; }
button:disabled { opacity: .4; cursor: default; }
.etat { font-size: 15px; opacity: .8; }
.vu { width: 220px; height: 10px; border-radius: 99px; background: #ffffff22; overflow: hidden; }
.vu i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #22d3ee, #a78bfa, #f472b6); transition: width .08s; }
audio { width: min(96vw, 600px); }
</style>
<script src="scenario.js"></script>
</head>
<body>
<h1>Enregistrement de votre voix — vidéo Comptapilot</h1>
<p class="etat" id="etat">1. Autorisez le micro. 2. Cliquez sur « Commencer » : un décompte de 3 secondes, puis lisez le texte quand il s'allume.</p>
<div class="barre">
  <button id="micro">Autoriser le micro</button>
  <button id="go" disabled>Commencer l'enregistrement</button>
  <button id="stop" class="second" disabled>Arrêter</button>
  <span class="vu" title="Niveau du micro"><i id="niveau"></i></span>
</div>
<div class="texte" id="texte"><small>Texte à dire</small>Le texte apparaîtra ici.</div>
<p class="suivant" id="suivant"></p>
<div class="cadre" id="cadre"><iframe id="anim" src="presentation.html?t=0"></iframe></div>
<audio id="ecoute" controls hidden></audio>
<div class="barre"><a id="telecharger" hidden><button>Télécharger voix.webm</button></a></div>
<script>
const $ = (id) => document.getElementById(id);
const cadre = $('cadre'), anim = $('anim');
const ajuster = () => (anim.style.transform = `scale(${cadre.clientWidth / 1920})`);
addEventListener('resize', ajuster); ajuster();

let flux, enreg, morceaux = [], t0 = 0, minuterie;
$('micro').onclick = async () => {
  try {
    flux = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    const ac = new AudioContext(), an = ac.createAnalyser();
    ac.createMediaStreamSource(flux).connect(an);
    const d = new Uint8Array(an.fftSize);
    (function vu() { an.getByteTimeDomainData(d); let m = 0; for (const v of d) m = Math.max(m, Math.abs(v - 128)); $('niveau').style.width = Math.min(100, m * 1.6) + '%'; requestAnimationFrame(vu); })();
    $('micro').disabled = true; $('go').disabled = false;
    $('etat').textContent = 'Micro prêt. Parlez pour vérifier que la jauge bouge, puis cliquez sur « Commencer ».';
  } catch (e) { $('etat').textContent = 'Micro refusé ou indisponible : ' + e.message; }
};

function afficher(t) {
  const sc = SCENARIO.scenes;
  const i = sc.findLastIndex((s) => t >= s.voix.a - 0.8);
  const cour = sc[i], suiv = sc[i + 1];
  if (cour) {
    const actif = t >= cour.voix.a;
    $('texte').className = 'texte' + (actif ? ' actif' : '');
    $('texte').innerHTML = `<small>${actif ? 'À vous — lisez maintenant' : 'Préparez-vous…'}</small>${cour.voix.texte}`;
  }
  $('suivant').textContent = suiv ? `Ensuite (dans ${Math.max(0, suiv.voix.a - t).toFixed(0)} s) : ${suiv.voix.texte}` : '';
}

$('go').onclick = async () => {
  $('go').disabled = true;
  for (const n of [3, 2, 1]) { $('texte').className = 'texte'; $('texte').innerHTML = `<small>Départ dans</small>${n}`; await new Promise((r) => setTimeout(r, 1000)); }
  morceaux = [];
  enreg = new MediaRecorder(flux, { mimeType: 'audio/webm;codecs=opus', audioBitsPerSecond: 160000 });
  enreg.ondataavailable = (e) => e.data.size && morceaux.push(e.data);
  enreg.onstop = terminer;
  enreg.start(250);
  t0 = performance.now();
  anim.contentWindow.jouer();
  $('stop').disabled = false;
  $('etat').textContent = 'Enregistrement en cours…';
  minuterie = setInterval(() => {
    const t = (performance.now() - t0) / 1000;
    afficher(t);
    if (t >= SCENARIO.duree + 0.3) arreter();
  }, 100);
};
function arreter() { clearInterval(minuterie); if (enreg?.state === 'recording') enreg.stop(); $('stop').disabled = true; }
$('stop').onclick = arreter;
function terminer() {
  const blob = new Blob(morceaux, { type: 'audio/webm' });
  const url = URL.createObjectURL(blob);
  $('ecoute').src = url; $('ecoute').hidden = false;
  const a = $('telecharger'); a.href = url; a.download = 'voix.webm'; a.hidden = false;
  $('etat').textContent = 'Terminé. Réécoutez ; si c’est bon, téléchargez voix.webm et placez-le dans le dossier video/ du projet. Sinon, rechargez la page et recommencez.';
  $('go').disabled = false;
}
</script>
</body>
</html>
