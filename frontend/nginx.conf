# Protocole d'origine : HTTPS quand la requête arrive par le tunnel Cloudflare (cookie de session « Secure »).
map $http_x_forwarded_proto $proto_client {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Adresse réelle du visiteur (limitation de débit de l'API) : le tunnel Cloudflare, qui tourne sur l'hôte,
  # la transmet dans CF-Connecting-IP. L'en-tête n'est cru que pour les connexions venant de l'hôte ou du
  # réseau Docker : un client qui se connecte directement ne peut pas se faire passer pour une autre adresse.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 172.16.0.0/12;
  real_ip_header CF-Connecting-IP;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  client_max_body_size 5m;

  # API : relayée vers le conteneur backend (même origine, le cookie de session fonctionne sans CORS).
  location /api/ {
    # Adresse du backend relue via le DNS de Docker : un backend recréé (nouvelle IP) reste joignable sans redémarrer nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://backend:4100;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Remplace (et non complète) X-Forwarded-For : l'API lit une seule adresse, fiable.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $proto_client;
    proxy_read_timeout 60s;
  }

  # Fichiers produits par Vite : noms empreintés, cache long.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/en-tetes-securite.conf;
    try_files $uri =404;
  }

  # Application installable : manifeste au bon type, service worker jamais mis en cache.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/en-tetes-securite.conf;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
    include /etc/nginx/snippets/en-tetes-securite.conf;
  }

  # Application monopage : toute autre route renvoie index.html, jamais mis en cache.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/en-tetes-securite.conf;
    try_files $uri $uri/ /index.html;
  }
}
